name: Apply dark-pattern Insight payload

on:
  push:
    branches:
      - insight-dark-pattern-guideline-20261126

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: insight-dark-pattern-guideline-20261126
          fetch-depth: 0

      - name: Restore reviewed publication files
        shell: bash
        run: |
          set -euo pipefail
          cat .dark-pattern-payload/part*.b64 > /tmp/dark-pattern-payload.b64
          base64 -d /tmp/dark-pattern-payload.b64 | xz -d > /tmp/dark-pattern-payload.tar
          tar -xf /tmp/dark-pattern-payload.tar -C .
          rm -rf .dark-pattern-payload
          rm -f .github/workflows/apply-dark-pattern-insight.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish reviewed bilingual dark-pattern guideline Insight"
          git push origin HEAD:insight-dark-pattern-guideline-20261126
